name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  demo:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Workspace bins are linked at install time; re-link now that packages/cli/dist/bin.js exists.
      - run: pnpm install --frozen-lockfile --offline

      - name: The planted bug must be caught
        working-directory: examples/invoice-agent
        run: |
          set +e
          pnpm exec rolecall run > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          # Exit 1 = violations found. Anything else (0 = missed, 2 = crashed) fails this check.
          if [ "$code" -ne 1 ] || ! grep -q "partial refund above limit" out.txt; then
            echo "::error::Rolecall did not catch the planted authorization bug (exit $code)"; exit 1
          fi

      - name: The fixed demo passes through the Rolecall action
        uses: ./actions/run
        env:
          INVOICE_DEMO_FIXED: '1'
        with:
          working-directory: examples/invoice-agent
